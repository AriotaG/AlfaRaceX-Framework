name: Build Legacy AlfaRaceX Updater

on:
  pull_request:
    paths:
      - "updater/**"
      - ".github/workflows/build-updater.yml"
  push:
    branches: [main]
    paths:
      - "updater/**"
      - ".github/workflows/build-updater.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Install branding render tools
        run: sudo apt-get update && sudo apt-get install -y librsvg2-bin imagemagick

      - name: Prepare AlfaRaceX branding
        shell: pwsh
        run: ./updater/prepare-branding.ps1

      - name: Publish single-file Windows executable
        shell: pwsh
        run: dotnet publish updater/AlfaRaceX.Updater/AlfaRaceX.Updater.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:DebugType=None -p:DebugSymbols=false -o out

      - name: Create SHA256
        shell: pwsh
        run: |
          $hash=(Get-FileHash out/AlfaRaceX-Updater.exe -Algorithm SHA256).Hash.ToLower()
          "$hash  AlfaRaceX-Updater.exe" | Out-File -Encoding ascii out/AlfaRaceX-Updater.sha256

      - uses: actions/upload-artifact@v4
        with:
          name: AlfaRaceX-Updater-win-x64
          path: |
            out/AlfaRaceX-Updater.exe
            out/AlfaRaceX-Updater.sha256
