name: Bootstrap AlfaRaceX source tree

on:
  push:
    branches: [main]
    paths:
      - bootstrap-0.8.0-dev.ready

permissions:
  contents: write

jobs:
  expand:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Reassemble and expand source snapshot
        shell: bash
        run: |
          set -euo pipefail
          test -f bootstrap-0.8.0-dev.ready || exit 0
          cat bootstrap-0.8.0-dev.b64.part* > /tmp/arx.b64
          base64 -d /tmp/arx.b64 > /tmp/arx.zip
          rm -rf /tmp/arx
          mkdir -p /tmp/arx
          unzip -q /tmp/arx.zip -d /tmp/arx
          test -f /tmp/arx/AlfaRaceX-Framework/VERSION
          test "$(cat /tmp/arx/AlfaRaceX-Framework/VERSION)" = "0.8.0-dev"
          rsync -a --delete             --exclude='.git/'             --exclude='.github/workflows/bootstrap-sync.yml'             /tmp/arx/AlfaRaceX-Framework/ ./
      - name: Commit expanded tree
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "AlfaRaceX Automation"
          git config user.email "58816127+AriotaG@users.noreply.github.com"
          git add -A
          git commit -m "feat: import AlfaRaceX 0.8.0-dev source tree"
          git push origin HEAD:main
