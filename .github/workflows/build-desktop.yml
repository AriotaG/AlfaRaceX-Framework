name: Build AlfaRaceX Desktop

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - desktop-v1
      - work/desktop-production-ui
    paths:
      - "desktop/**"
      - "updater/AlfaRaceX.Updater/**"
      - "updater/branding/**"
      - "distribution/**"
      - ".github/workflows/build-desktop.yml"
  pull_request:
    paths:
      - "desktop/**"
      - "updater/AlfaRaceX.Updater/**"
      - "updater/branding/**"
      - "distribution/**"
      - ".github/workflows/build-desktop.yml"

permissions:
  contents: read

jobs:
  build-test-package:
    runs-on: windows-latest
    timeout-minutes: 25
    defaults:
      run:
        shell: pwsh

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - uses: actions/setup-node@v4
        with:
          node-version: "22.x"

      - name: Vendor local Bootstrap assets
        working-directory: desktop/AlfaRaceX.Desktop
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          New-Item -ItemType Directory -Force -Path wwwroot/vendor/bootstrap/css | Out-Null
          New-Item -ItemType Directory -Force -Path wwwroot/vendor/bootstrap/js | Out-Null
          Copy-Item node_modules/bootstrap/dist/css/bootstrap.min.css wwwroot/vendor/bootstrap/css/bootstrap.min.css -Force
          Copy-Item node_modules/bootstrap/dist/js/bootstrap.bundle.min.js wwwroot/vendor/bootstrap/js/bootstrap.bundle.min.js -Force
          Copy-Item node_modules/bootstrap-icons wwwroot/vendor/bootstrap-icons -Recurse -Force

      - name: UI behavior regression tests
        run: node desktop/tests/ui.test.cjs

      - name: Restore and build
        run: |
          dotnet restore desktop/AlfaRaceX.Desktop/AlfaRaceX.Desktop.csproj
          dotnet build desktop/AlfaRaceX.Desktop/AlfaRaceX.Desktop.csproj -c Release --no-restore

      - name: Publish Windows x64
        run: |
          dotnet publish desktop/AlfaRaceX.Desktop/AlfaRaceX.Desktop.csproj -c Release -r win-x64 --self-contained true --no-restore -o publish

      - name: Smoke test published executable
        run: |
          $proc = Start-Process -FilePath ".\publish\AlfaRaceX.exe" -ArgumentList "--smoke-test" -Wait -PassThru
          if ($proc.ExitCode -ne 0) { throw "Published executable smoke test failed with code $($proc.ExitCode)." }

      - name: Validate real firmware downloads and error handling
        run: |
          $p = Start-Process .\publish\AlfaRaceX.exe -ArgumentList '--network-validation' -PassThru
          if (-not $p.WaitForExit(240000)) { $p.Kill(); throw 'Network test timed out' }
          if ($p.ExitCode -ne 0) { throw 'Network validation failed' }

      - name: Validate real WPF and WebView2 first and subsequent launch
        env:
          ALFARACEX_UI_TEST_ROOT: ${{ runner.temp }}/AlfaRaceX-UI-Test
        run: |
          foreach ($stage in @('', '--subsequent')) {
            $p = Start-Process .\publish\AlfaRaceX.exe -ArgumentList "--ui-validation $stage" -PassThru
            if (-not $p.WaitForExit(120000)) { $p.Kill(); throw 'UI test timed out' }
            if ($p.ExitCode -ne 0) { throw "UI validation failed: $($p.ExitCode)" }
          }

      - name: Upload UI validation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: AlfaRaceX-UI-Validation
          path: |
            ${{ runner.temp }}/AlfaRaceX-UI-Test/validation/*
            ${{ runner.temp }}/AlfaRaceX-Network-Test/network-validation.json
          if-no-files-found: warn

      - name: Create Inno Setup installer
        run: |
          [xml]$project = Get-Content desktop/AlfaRaceX.Desktop/AlfaRaceX.Desktop.csproj
          $version = [string]$project.Project.PropertyGroup.Version
          & "${env:ProgramFiles(x86)}/Inno Setup 6/ISCC.exe" "/DAppVersion=$version" desktop/installer/AlfaRaceX.iss
          if ($LASTEXITCODE -ne 0) { throw "Inno Setup failed" }
          $hash = (Get-FileHash artifacts/AlfaRaceX-Setup.exe -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  AlfaRaceX-Setup.exe" | Out-File -Encoding ascii artifacts/AlfaRaceX-Setup.sha256

      - name: Install, upgrade, uninstall and reinstall with persistence
        run: |
          $installRoot = Join-Path $env:RUNNER_TEMP "AlfaRaceX-Installed"
          $sentinel = Join-Path $env:LOCALAPPDATA "AlfaRaceX/Desktop/persistence-check.txt"
          New-Item -ItemType Directory -Force (Split-Path $sentinel) | Out-Null
          Set-Content $sentinel "retain-user-data"
          foreach ($pass in 1..2) {
            $p = Start-Process artifacts/AlfaRaceX-Setup.exe -ArgumentList @('/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART',"/DIR=$installRoot") -Wait -PassThru
            if ($p.ExitCode -ne 0) { throw "Install failed $($p.ExitCode)" }
            $p = Start-Process "$installRoot/AlfaRaceX.exe" -ArgumentList '--smoke-test' -Wait -PassThru
            if ($p.ExitCode -ne 0) { throw "Installed smoke failed" }
          }
          $p = Start-Process "$installRoot/unins000.exe" -ArgumentList '/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART' -Wait -PassThru
          if ($p.ExitCode -ne 0 -or (Test-Path "$installRoot/AlfaRaceX.exe")) { throw "Uninstall failed" }
          if ((Get-Content $sentinel) -ne 'retain-user-data') { throw "User data lost" }
          $p = Start-Process artifacts/AlfaRaceX-Setup.exe -ArgumentList @('/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART',"/DIR=$installRoot") -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "Reinstall failed" }
          if ((Get-Content $sentinel) -ne 'retain-user-data') { throw "User data lost on reinstall" }

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: AlfaRaceX-Desktop-Setup-win-x64
          if-no-files-found: error
          retention-days: 30
          path: |
            artifacts/AlfaRaceX-Setup.exe
            artifacts/AlfaRaceX-Setup.sha256


