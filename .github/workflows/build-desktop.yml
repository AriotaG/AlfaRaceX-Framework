name: Build AlfaRaceX Desktop

on:
  workflow_dispatch:
    inputs:
      publish:
        description: "Publish a draft prerelease after all software gates pass"
        type: boolean
        default: false
  push:
    branches:
      - main
      - desktop-v1
    paths:
      - "desktop/**"
      - "updater/AlfaRaceX.Updater/**"
      - "updater/branding/**"
      - "distribution/**"
      - "tests/AlfaRaceX.HostTests/**"
      - ".github/workflows/build-desktop.yml"
  pull_request:
    paths:
      - "desktop/**"
      - "updater/AlfaRaceX.Updater/**"
      - "updater/branding/**"
      - "distribution/**"
      - "tests/AlfaRaceX.HostTests/**"
      - ".github/workflows/build-desktop.yml"

permissions:
  contents: write

jobs:
  build-test-package:
    runs-on: windows-latest
    timeout-minutes: 25
    defaults:
      run:
        shell: pwsh

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Verify vendored local Bootstrap assets
        run: |
          foreach ($file in @('css/bootstrap.min.css','js/bootstrap.bundle.min.js','LICENSE')) {
            if (!(Test-Path "desktop/AlfaRaceX.Desktop/wwwroot/vendor/bootstrap/$file")) { throw "Missing Bootstrap asset: $file" }
          }

      - name: Host validation tests
        run: dotnet run --project tests/AlfaRaceX.HostTests -c Release

      - name: Restore and build
        run: |
          dotnet restore desktop/AlfaRaceX.Desktop/AlfaRaceX.Desktop.csproj
          dotnet build desktop/AlfaRaceX.Desktop/AlfaRaceX.Desktop.csproj -c Release --no-restore

      - name: Publish Windows x64
        run: |
          dotnet publish desktop/AlfaRaceX.Desktop/AlfaRaceX.Desktop.csproj -c Release -r win-x64 --self-contained true --no-restore -o publish

      - name: Smoke test published executable
        run: |
          $proc = Start-Process -FilePath ".\publish\AlfaRaceX.exe" -ArgumentList "--smoke-test" -WindowStyle Hidden -Wait -PassThru
          if ($proc.ExitCode -ne 0) { throw "Published executable smoke test failed with code $($proc.ExitCode)." }

      - name: Verify actual WebView2 and UI bridge
        run: |
          $proc = Start-Process -FilePath ".\publish\AlfaRaceX.exe" -ArgumentList "--ui-smoke-test" -WindowStyle Hidden -PassThru
          if (!$proc.WaitForExit(60000)) { Stop-Process -Id $proc.Id; throw "UI smoke timed out" }
          if ($proc.ExitCode -ne 0) { throw "UI smoke failed: $($proc.ExitCode)" }

      - name: Install Velopack CLI
        run: dotnet tool install -g vpk --version 1.2.0

      - name: Create Velopack installer
        run: |
          [xml]$project = Get-Content desktop/AlfaRaceX.Desktop/AlfaRaceX.Desktop.csproj
          $version = [string]$project.Project.PropertyGroup.Version
          vpk pack --packId AlfaRaceX.Desktop --packVersion $version --packDir publish --mainExe AlfaRaceX.exe --packTitle AlfaRaceX --framework webview2
          New-Item -ItemType Directory -Force -Path artifacts | Out-Null
          $setup = Get-ChildItem Releases -Filter "*Setup.exe" | Select-Object -First 1
          if (-not $setup) { throw "Velopack Setup.exe not found." }
          Copy-Item $setup.FullName artifacts/AlfaRaceX-Setup.exe -Force
          $hash = (Get-FileHash artifacts/AlfaRaceX-Setup.exe -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  AlfaRaceX-Setup.exe" | Out-File -Encoding ascii artifacts/AlfaRaceX-Setup.sha256

      - name: Install generated Setup and smoke test installed app
        run: |
          $installRoot = Join-Path $env:RUNNER_TEMP "AlfaRaceX-Installed"
          if (Test-Path $installRoot) { throw "Install test directory must be fresh: $installRoot" }
          $setupProc = Start-Process -FilePath ".\artifacts\AlfaRaceX-Setup.exe" -ArgumentList @("--silent","--installto",$installRoot) -WindowStyle Hidden -Wait -PassThru
          if ($setupProc.ExitCode -ne 0) { throw "Installer returned exit code $($setupProc.ExitCode)." }
          $exe = Get-ChildItem $installRoot -Recurse -Filter "AlfaRaceX.exe" | Select-Object -First 1
          if (-not $exe) { throw "Installed AlfaRaceX.exe not found." }
          $smokeProc = Start-Process -FilePath $exe.FullName -ArgumentList "--ui-smoke-test" -WindowStyle Hidden -Wait -PassThru
          if ($smokeProc.ExitCode -ne 0) { throw "Installed executable smoke test failed with code $($smokeProc.ExitCode)." }

      - name: Upload smoke diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: desktop-smoke-diagnostics
          if-no-files-found: ignore
          path: ${{ runner.temp }}/AlfaRaceX-Smoke-*/**

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: AlfaRaceX-Desktop-Setup-win-x64
          if-no-files-found: error
          retention-days: 30
          path: |
            artifacts/AlfaRaceX-Setup.exe
            artifacts/AlfaRaceX-Setup.sha256
            Releases/*.nupkg
            Releases/RELEASES

      - name: Publish AlfaRaceX Desktop release
        if: github.event_name == 'workflow_dispatch' && inputs.publish && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          [xml]$project = Get-Content desktop/AlfaRaceX.Desktop/AlfaRaceX.Desktop.csproj
          $version = [string]$project.Project.PropertyGroup.Version
          $tag = "desktop-v$version"
          gh release view $tag *> $null
          if ($LASTEXITCODE -eq 0) { throw "Release already exists; increment version. Published assets are immutable." }
          gh release create $tag --draft --prerelease --target $env:GITHUB_SHA --title "AlfaRaceX Desktop $version" --notes "Software gates passed. Hardware validation required; see audit report."
          gh release upload $tag artifacts/AlfaRaceX-Setup.exe artifacts/AlfaRaceX-Setup.sha256 Releases/*-full.nupkg Releases/RELEASES
