name: Build AlfaRaceX Desktop

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - desktop-v1
    paths:
      - "desktop/**"
      - "updater/AlfaRaceX.Updater/**"
      - "updater/branding/**"
      - "distribution/**"
      - ".github/workflows/build-desktop.yml"
  pull_request:
    paths:
      - "desktop/**"
      - "updater/AlfaRaceX.Updater/**"
      - "updater/branding/**"
      - "distribution/**"
      - ".github/workflows/build-desktop.yml"

permissions:
  contents: write

jobs:
  build-test-package:
    runs-on: windows-latest
    timeout-minutes: 25
    defaults:
      run:
        shell: pwsh

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - uses: actions/setup-node@v4
        with:
          node-version: "22.x"

      - name: Vendor local Bootstrap assets
        working-directory: desktop/AlfaRaceX.Desktop
        run: |
          npm install --ignore-scripts --no-audit --no-fund
          New-Item -ItemType Directory -Force -Path wwwroot/vendor/bootstrap/css | Out-Null
          New-Item -ItemType Directory -Force -Path wwwroot/vendor/bootstrap/js | Out-Null
          Copy-Item node_modules/bootstrap/dist/css/bootstrap.min.css wwwroot/vendor/bootstrap/css/bootstrap.min.css -Force
          Copy-Item node_modules/bootstrap/dist/js/bootstrap.bundle.min.js wwwroot/vendor/bootstrap/js/bootstrap.bundle.min.js -Force
          Copy-Item node_modules/bootstrap/LICENSE wwwroot/vendor/bootstrap/LICENSE -Force

      - name: Restore and build
        run: |
          dotnet restore desktop/AlfaRaceX.Desktop/AlfaRaceX.Desktop.csproj
          dotnet build desktop/AlfaRaceX.Desktop/AlfaRaceX.Desktop.csproj -c Release --no-restore

      - name: Publish Windows x64
        run: |
          dotnet publish desktop/AlfaRaceX.Desktop/AlfaRaceX.Desktop.csproj -c Release -r win-x64 --self-contained true --no-restore -o publish

      - name: Smoke test published executable
        run: |
          $proc = Start-Process -FilePath ".\publish\AlfaRaceX.exe" -ArgumentList "--smoke-test" -Wait -PassThru
          if ($proc.ExitCode -ne 0) { throw "Published executable smoke test failed with code $($proc.ExitCode)." }

      - name: Exercise real WebView2 UI and backend bridge
        run: |
          $profile = Join-Path $env:RUNNER_TEMP "AlfaRaceX-UI-Smoke-$([guid]::NewGuid().ToString('N'))"
          "ARX_UI_SMOKE_ROOT=$profile" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          $proc = Start-Process -FilePath ".\publish\AlfaRaceX.exe" -ArgumentList @("--ui-smoke-test", "`"--smoke-root=$profile`"") -WindowStyle Hidden -PassThru
          if (-not $proc.WaitForExit(60000)) {
            Stop-Process -Id $proc.Id -Force
            throw "WebView2 UI smoke test timed out."
          }
          if ($proc.ExitCode -ne 0) { throw "WebView2 UI smoke failed with code $($proc.ExitCode). See smoke evidence." }

      - name: Preserve UI test evidence
        if: always() && env.ARX_UI_SMOKE_ROOT != ''
        uses: actions/upload-artifact@v4
        with:
          name: AlfaRaceX-UI-smoke
          path: |
            ${{ env.ARX_UI_SMOKE_ROOT }}/ui-smoke-result.txt
            ${{ env.ARX_UI_SMOKE_ROOT }}/ui-*.png

      - name: Install Velopack CLI
        run: dotnet tool install -g vpk --version 1.2.0

      - name: Create Velopack installer
        run: |
          vpk pack --packId AlfaRaceX.Desktop --packVersion 0.1.0 --packDir publish --mainExe AlfaRaceX.exe --packTitle AlfaRaceX
          New-Item -ItemType Directory -Force -Path artifacts | Out-Null
          $setup = Get-ChildItem Releases -Filter "*Setup.exe" | Select-Object -First 1
          if (-not $setup) { throw "Velopack Setup.exe not found." }
          Copy-Item $setup.FullName artifacts/AlfaRaceX-Setup.exe -Force
          $hash = (Get-FileHash artifacts/AlfaRaceX-Setup.exe -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  AlfaRaceX-Setup.exe" | Out-File -Encoding ascii artifacts/AlfaRaceX-Setup.sha256

      - name: Install generated Setup and smoke test installed app
        run: |
          $installRoot = Join-Path $env:RUNNER_TEMP "AlfaRaceX-Installed"
          if (Test-Path $installRoot) { Remove-Item $installRoot -Recurse -Force }
          $setupProc = Start-Process -FilePath ".\artifacts\AlfaRaceX-Setup.exe" -ArgumentList @("--silent","--installto",$installRoot) -Wait -PassThru
          if ($setupProc.ExitCode -ne 0) { throw "Installer returned exit code $($setupProc.ExitCode)." }
          $exe = Get-ChildItem $installRoot -Recurse -Filter "AlfaRaceX.exe" | Select-Object -First 1
          if (-not $exe) { throw "Installed AlfaRaceX.exe not found." }
          $smokeProc = Start-Process -FilePath $exe.FullName -ArgumentList "--smoke-test" -Wait -PassThru
          if ($smokeProc.ExitCode -ne 0) { throw "Installed executable smoke test failed with code $($smokeProc.ExitCode)." }

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: AlfaRaceX-Desktop-Setup-win-x64
          if-no-files-found: error
          retention-days: 30
          path: |
            artifacts/AlfaRaceX-Setup.exe
            artifacts/AlfaRaceX-Setup.sha256
            Releases/*.nupkg
            Releases/RELEASES

      - name: Publish AlfaRaceX Desktop release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          [xml]$project = Get-Content desktop/AlfaRaceX.Desktop/AlfaRaceX.Desktop.csproj
          $version = [string]$project.Project.PropertyGroup.Version
          $tag = "desktop-v$version"
          gh release view $tag *> $null
          if ($LASTEXITCODE -ne 0) {
            gh release create $tag --title "AlfaRaceX Desktop $version" --notes "Prima distribuzione Windows installabile di AlfaRaceX Desktop. Build WPF/WebView2 con dati persistenti separati, SQLite e packaging Velopack."
          }
          gh release upload $tag artifacts/AlfaRaceX-Setup.exe artifacts/AlfaRaceX-Setup.sha256 Releases/*-full.nupkg Releases/RELEASES --clobber
